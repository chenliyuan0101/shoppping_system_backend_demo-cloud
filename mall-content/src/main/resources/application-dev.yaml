# =====================================================================
# 本地开发环境：只写"与公共不同的内容"（数据源/Redis/MinIO/内部密钥）
# 本文件不应进生产；提交 Git 时注意是否入库（涉密码）
# =====================================================================
spring:
  # Nacos(本地)：服务端 API 端口 8848（控制台是 8081，别混）
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
  # Redis(本地)：首页聚合缓存（key 与商品域共用，见 §2.9 第 5 条）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1s
  # 本服务自己的库：mall_content（表结构见 db/01-mall_content-schema.sql）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mall_content?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # P8-4：最小权限账号（只对 mall_content.* 有权限；跨库读会 ERROR 1142）
    username: mall_content
    password: dev-only-2026

# 日志：dev 开 debug（方法调用 + SQL + 路由 + 负载均衡选实例）
logging:
  level:
    com.mall.content: debug
    org.apache.ibatis: debug
    org.springframework.web.servlet.DispatcherServlet: debug
    org.springframework.cloud.loadbalancer: debug

mall:
  # MinIO(本地明文)：上传落对象存储
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: admin
    secret-key: minio123456
    bucket: mall
  # 内部接口共享密钥：既要校验**别人调我**（/internal/**），也要在**我调别人**时带上。
  # 与单体保持一致（同一把钥匙）；生产走 MALL_INTERNAL_TOKEN 环境变量。
  internal:
    token: mall-dev-only-internal-token-change-me
