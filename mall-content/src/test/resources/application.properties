# =====================================================================
# 测试专用配置（test classpath 的 application.properties 优先级高于 main 的 application.yaml）
# =====================================================================

# 测试期整体关闭服务注册：套件不该依赖"本机是否开着 Nacos"，
# 也不该往注册中心写一堆瞬时实例（每个 @SpringBootTest 都会触发一次注册）。
spring.cloud.nacos.discovery.enabled=false

# 缓存仍走真 Redis：Redis 未启动时 CacheService 会自动 fail-open，测试同样应当通过。
mall.cache.enabled=true

# 内部接口共享密钥：**不在这里配**——见 ContentTestBase 的 javadoc。
# 原因：profile 专属文件（application-dev.yaml）优先级高于本文件，写在这里会被 dev 令牌盖掉。
# 测试令牌统一由 @SpringBootTest(properties="mall.internal.token=test-internal-token") 注入。
