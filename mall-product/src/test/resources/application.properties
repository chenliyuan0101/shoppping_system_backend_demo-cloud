# =====================================================================
# 测试专用配置（test classpath 的 application.properties 优先级高于 main 的 application.yaml）
# =====================================================================

# 测试期整体关闭服务注册（同 P1~P5 的约定：套件不该依赖本机是否开着 Nacos）
spring.cloud.nacos.discovery.enabled=false

# ⚠️ 内部令牌与网关身份凭据 **不在这里配**——profile 专属文件（application-dev.yaml）优先级更高，
# 写在这里会被 dev 令牌盖掉，而"无令牌 → 403"的用例照样通过、把问题掩盖掉（P1/P2/P3/P4/P5 都踩过）。
# 测试令牌统一由 ProductTestBase 的 @SpringBootTest(properties=...) 注入。

# ⚠️ 数据源**不在这里覆盖**：本服务连的就是自己的库 mall_product（application-dev.yaml），
# "测试连错库"这件事靠 ProductTestBase 每个用例断言 `SELECT DATABASE() = 'mall_product'` 兜住——
# 比在测试配置里再写一遍 jdbc url 更可靠（写两遍等于多一个会漂移的真相）。
