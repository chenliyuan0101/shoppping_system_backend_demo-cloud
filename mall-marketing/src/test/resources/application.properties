# =====================================================================
# 测试专用配置（test classpath 的 application.properties 优先级高于 main 的 application.yaml）
# =====================================================================

# 测试期整体关闭服务注册（同 P1/P2/P3/P4 的约定：套件不该依赖本机是否开着 Nacos）
spring.cloud.nacos.discovery.enabled=false

# ⚠️ 内部令牌与网关身份凭据 **不在这里配**——profile 专属文件（application-dev.yaml）优先级更高，
# 写在这里会被 dev 令牌盖掉，而"无令牌 → 403"的用例照样通过、把问题掩盖掉（P1/P2/P3/P4 都踩过）。
# 测试令牌统一由 MarketingTestBase 的 @SpringBootTest(properties=...) 注入。

# P5 批次 2 起本服务要 Redis（**只用于领券限流计数**，连的是 application-dev.yaml 里的本机 6379）。
# ⚠️ 刻意**不**在这里写 mall.rate-limit.enabled=false：那会让"限流搬过来还生效"这件事
#    在测试里永远验不到（测试会全绿，而线上限流是坏的）。限流用例自己用
#    assumeTrue(redisUp()) 守卫——本机没起 Redis 时按"跳过"（fail-open 本来就是正确行为）。
# Redis 不可用的降级路径由 RateLimitAspectTest（纯单测，mock CacheService 返回 -1）覆盖。
