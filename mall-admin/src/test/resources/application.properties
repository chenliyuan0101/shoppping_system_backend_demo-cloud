# =====================================================================
# 测试专用配置（test classpath 的 application.properties 优先级高于 main 的 application.yaml）
# =====================================================================

# 测试期整体关闭服务注册（同 P1~P6 的约定：套件不该依赖本机是否开着 Nacos）
spring.cloud.nacos.discovery.enabled=false

# 缓存/令牌版本仍走真 Redis：Redis 未启动时按 fail-open 降级，测试同样应当通过。
mall.cache.enabled=true

# ⚠️ 网关身份凭据 **不在这里配** —— profile 专属文件（application-dev.yaml）优先级更高，
# 写在这里会被 dev 令牌盖掉，而"凭据不对 → 401"的用例照样通过、把问题掩盖（P1~P5 都踩过）。
# 测试凭据统一由 AdminTestBase 的 @SpringBootTest(properties=...) 注入。

# 接口限流统一关闭：真库套件会高频调用后台登录（限流是 10 次/60 秒），
# 不关的话"功能测试"会变成"限流测试"（单体侧同一约定：demo 的 application.properties 就是这么写的）。
# 限流切面本身是逐字搬过来的，其行为由单体的 RateLimitMySqlTest 覆盖。
mall.rate-limit.enabled=false

# 🔴 P7 状态缓存对账任务在测试期**关闭调度**（生产默认 true，见 application.yaml）：
#   它的职责是"把缓存纠正到与库一致"，一旦允许它并发跑，用例里
#   "改库 → 断言缓存还是旧值 → 手动对账 → 断言已纠正" 这种时序断言就会随机失效。
#   对账逻辑本身由用例**直接调用** AdminStatusService.reconcile() 覆盖；
#   开关语义（关掉就不跑 / 异常不外抛）由 AdminStatusReconcileTaskTest 单测覆盖。
mall.admin.status-reconcile-enabled=false
