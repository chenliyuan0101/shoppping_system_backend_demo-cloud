# =====================================================================
# 本地开发环境：只写"与公共不同的内容"（数据源/Redis/密钥）
# =====================================================================
spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848    # 服务端 API 端口（控制台是 8081，别混）
        namespace: public
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1s
  # RabbitMQ(本地)：消费订单领域事件写站内消息（P3-5 起本服务是唯一写入方）。
  # 与单体 dev 配置同一个 broker、同一个 virtual-host；消费者连不上时事件只是堆积在队列里，
  # 不影响下单/支付（发布方 fail-open）。
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 3s
  # 本服务自己的库：mall_user（表结构见 db/01-mall_user-schema.sql）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mall_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # P8-4：最小权限账号（只对 mall_user.* 有权限；跨库读会 ERROR 1142）
    username: mall_user
    password: dev-only-2026

logging:
  level:
    com.mall.usercenter: debug
    org.apache.ibatis: debug
    org.springframework.web.servlet.DispatcherServlet: debug

mall:
  jwt:
    # 与单体/网关保持一致（过渡期三方共用同一个密钥；生产走 MALL_JWT_SECRET）
    secret: mall-dev-only-secret-0123456789abcdef-change-me
  # 内部接口共享密钥：校验"别人调我"（/internal/**）也要在"我调别人"时带上（商品域等）
  internal:
    token: mall-dev-only-internal-token-change-me
  # P3：网关身份凭据。请求带这个头（值相同）时，本服务**信任**网关注入的 X-Member-Id（§4.4 ①），
  # 不再自己验签/查库。必须与网关的 mall.gateway.auth-token 逐字一致（本机开发值取自网关 dev 配置）。
  # 未配置时 fail-closed → 所有需要登录的接口都返回 401（本服务没有"自己验签"这条退路）。
  gateway:
    auth-token: mall-dev-only-gateway-token-change-me
