# =====================================================================
# 测试专用配置(test classpath 的 application.properties 优先级高于 main 的 application.yaml)
# 说明：所有 @SpringBootTest 套件都会加载本文件，无需在每个测试类上重复声明。
# =====================================================================

# =====================================================================
# ⚠️ 这里**不要**放 spring.datasource.* —— 见下面这条实测教训：
#   P8-4 把数据源换成最小权限账号后，我第一版把 `spring.datasource.username=root` 写在本文件里想给测试兜底，
#   结果**完全无效**：`spring.profiles.active=dev` 生效时，**profile 专属文件**（main 的 application-dev.yaml）
#   优先级**高于** test classpath 的 application.properties ⇒ 45 个用例直接报
#   `ERROR 1142 ... INSERT INTO mall_user.ums_member`（BadSqlGrammar 包装的权限错误）。
#   ⇒ 测试期覆盖 dev 的值，只能写在 `@TestPropertySource` 内联属性里（见 support/MySqlTestBase）。
# =====================================================================

# ---------------------------------------------------------------------
# P8-3/P8-4：**所有测试上下文一律关掉发件箱的定时任务**。
#   原因（实测过的真干扰）：Spring 测试会**同时缓存多个上下文**（不同 properties = 不同上下文），
#   每个上下文都有自己的 @Scheduled。只要有一个上下文用了默认参数（重投间隔 2 秒），
#   它的 TradeOutboxRelay 就会去扫**同一张** trade_outbox 表 —— 于是
#   TradeOutboxMySqlTest 里"连续 markFailed 两次 ⇒ 应为已放弃"的断言会**偶发**变成"已发送"
#   （被别的上下文的定时任务抢先投出去了）。症状：单跑绿、全量偶发红。
#   ⇒ 口径：**自动的那条路径在测试期必须静止**，需要时由用例显式调 relay.relay()；
#     要测"自动重投"的那个套件自己在 @SpringBootTest(properties=...) 里把开关打开（class 级优先）。
# ---------------------------------------------------------------------
mall.mq.outbox.relay-enabled=false
mall.mq.outbox.relay-interval-ms=3600000
mall.mq.outbox.relay-initial-delay-ms=3600000

# 接口限流统一关闭：真库套件会高频调用 登录/注册/下单，限流会把"功能测试"变成"限流测试"。
# 限流本身的验证见 RateLimitMySqlTest(用 @SpringBootTest(properties=...) 单独开启)。
mall.rate-limit.enabled=false

# P1：测试期整体关闭服务注册——套件不该依赖"本机是否开着 Nacos"，
# 也不该往注册中心写一堆瞬时实例（每个 @SpringBootTest 都会触发一次注册）。
# 注册属于部署形态，见《微服务改造方案.md》P1。
spring.cloud.nacos.discovery.enabled=false

# 缓存/令牌版本/幂等仍走真 Redis：Redis 未启动时按 fail-open 降级，测试同样应当通过。
mall.cache.enabled=true

# RabbitMQ 默认关闭：绝大多数套件不关心 MQ，关掉可避免"没装 RabbitMQ 的环境"里
# 每个用例都去尝试投递/连监听容器。MQ 链路本身的验证见 OrderTimeoutMqMySqlTest
# (用 @SpringBootTest(properties="mall.mq.enabled=true") 单独开启)。
mall.mq.enabled=false

# 兜底扫描在测试期放到 1 小时：避免它和"MQ 消费者关单"的断言互相干扰(谁关的单要能分辨)
mall.order.timeout-scan-interval-ms=3600000

# 索引同步消息的重试参数：默认值(10s / 3 次)对用例来说太慢，套件里另用 properties 覆盖成
# 200ms / 1 次，这样"失败 → 重试 → 死信"整条链路可以秒级断言。
mall.mq.sync-retry-delay-ms=200
mall.mq.sync-max-retry=1
mall.mq.event-retry-delay-ms=200
mall.mq.event-max-retry=1
# P5 步骤 C：券契约在测试期由 MarketingTestDoubleConfig 提供（进程内没有 marketing 可调）。
# ⚠️ 与 MySqlTestBase 的 @TestPropertySource 两处都写，是刻意的：基类那份只覆盖继承
#    MySqlTestBase 的套件；不继承基类的 @SpringBootTest 上下文拿不到它——实测后果是
#    "远程接线胜出、替身静默失效、/api/order/preview 500"，症状与坑描述完全一致。
mall.marketing.remote=false
# 2026-09-16：与上面那条同一套双保险。UserCenterRemoteConfig 现在是 matchIfMissing=true，
# 不显式关掉就会走**真远程**（测试进程内没有 user-center 可调），4 个会员域契约必须由
# UserCenterTestDoubleConfig 顶上（基类 @TestPropertySource 里也有一份，见 MySqlTestBase）。
mall.user-center.remote=false