# =====================================================================
# 测试专用配置（test classpath 的 application.properties 优先级高于 main 的 application.yaml）
# =====================================================================

# 测试期整体关闭服务注册（同 P1/P2/P3 的约定：套件不该依赖本机是否开着 Nacos）
spring.cloud.nacos.discovery.enabled=false

# 缓存走真 Redis：未启动时 CacheService 自动 fail-open，测试仍应通过
mall.cache.enabled=true

# ⚠️ 内部令牌与网关身份凭据 **不在这里配**——profile 专属文件（application-dev.yaml）优先级更高，
# 写在这里会被 dev 令牌盖掉，而"无令牌 → 403"的用例照样通过、把问题掩盖掉（P2/P3 实测踩过两次）。
# 测试令牌统一由 ReviewTestBase 的 @SpringBootTest(properties=...) 注入。

# RabbitMQ 默认关闭（与单体/其它服务同一约定）：绝大多数套件不关心 MQ，关掉可避免"没装 RabbitMQ 的环境"里
# 每个上下文都去连监听容器。false = 消费者与拓扑都不装配 → 完全不连 broker。
# ⚠️ 注意 profile 优先级：**不要**把开关写进 application-dev.yaml（profile 专属配置优先级高于本文件，
#    会让每个测试上下文都去连 broker）。dev 要打开时用环境变量/命令行参数：
#      MALL_MQ_ENABLED=true mvn spring-boot:run
# MQ 链路本身见 com.mall.review.mq.OrderFinishedMqMySqlTest（用 @SpringBootTest(properties=...)
# 单独把开关打开，broker 不在时按 assumption 跳过）。
mall.mq.enabled=false
# 事件重试参数在测试里压到 200ms / 1 次（默认 10s / 3 次对用例太慢），便于秒级断言失败链路
mall.mq.event-retry-delay-ms=200
mall.mq.event-max-retry=1
