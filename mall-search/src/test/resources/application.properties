# =====================================================================
# 测试专用配置（test classpath 的 application.properties 优先级高于 main 的 application.yaml）
# =====================================================================

# 测试期整体关闭服务注册（同 P1~P5 的约定：套件不该依赖本机是否开着 Nacos）
spring.cloud.nacos.discovery.enabled=false

# ⚠️ 测试期**关闭 MQ**（与成品默认值 true 相反，这是**刻意**的）：
#   · 开着的话，本服务的消费者会与"单体里还在跑的那个消费者"**抢同一条工作队列**里的真实消息
#     （过渡期两边都在监听 mall.pms.es-sync）——测试不该干扰在跑的单体；
#   · 发布端也会真的往 broker 投消息。
#   MQ 专项套件用**用例级** @SpringBootTest(properties = "mall.mq.enabled=true") 显式打开
#   （P5 定的口径：不保留"看起来在生效其实永远退让"的全测试级替身，要用就在用例上写明）。
mall.mq.enabled=false

# ⚠️ 内部令牌**不在这里配**——profile 专属文件（application-dev.yaml）优先级更高，
# 写在这里会被 dev 令牌盖掉，而"无令牌 → 403"的用例照样通过、把问题掩盖掉（P1~P5 都踩过）。
# 测试令牌统一由 SearchTestBase 的 @SpringBootTest(properties=...) 注入。

# ⚠️ ES 连接**不在这里覆盖**：本服务的用例要打**真 ES**（规格 §7：本机 ES 在跑）。
# ⚠️ 跑之前必须先确认 ES 在：curl -s -k -u elastic:elasticsearch123456 https://127.0.0.1:9200/_cluster/health
#    否则按用例设计会**失败**（而不是静默跳过）——skip 不算通过（规格 §8/§9 的交付要求）。
